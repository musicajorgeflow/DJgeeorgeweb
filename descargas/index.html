t-size: clamp(54px,10vw,136px); line-height: .87; letter-spacing: -.08em; } header p { max-width: 530px; margin: 0; color: var(--muted); font-size: 17px; } .featured-section { margin: 0 0 76px; } .featured-body { display: flex; align-items: center; gap: 56px; } .section-label { display: flex; align-items: center; gap: 9px; margin: 0 0 8px; color: var(--gold); font: 10px 'DM Mono'; letter-spacing: .14em; text-transform: uppercase; } .section-label:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 15px #edc66b; } .section-title { margin: 0 0 18px; font-size: clamp(28px,4vw,44px); line-height: 1; letter-spacing: -.06em; } .featured-card { max-width: 360px; } .featured-card.is-visible { animation: featured-glow 5.5s ease-in-out infinite; } .featured-card .preview { border: 1px solid var(--gold); border-radius: 11px; box-shadow: 0 0 0 2px #e9be5826; accent-color: var(--gold); } .featured-side { display: none; } .all-title { margin: 0 0 22px; font-size: clamp(25px,3vw,34px); letter-spacing: -.055em; } .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 18px; padding-bottom: 96px; } .card { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: linear-gradient(145deg,#231a3dde,#151025de); box-shadow: 0 22px 60px #00000032; } .cover { position: relative; aspect-ratio: 1; overflow: hidden; background: #271c48; } .cover:after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg,transparent 48%,#130d2570); } .cover img { width: 100%; height: 100%; object-fit: cover; } .content { padding: 20px; } .content h2 { margin: 0 0 16px; font-size: 20px; letter-spacing: -.035em; line-height: 1.1; } .preview-label { display: block; margin-bottom: 6px; color: var(--muted); font: 10px 'DM Mono'; letter-spacing: .12em; text-transform: uppercase; } .preview { width: 100%; height: 38px; margin: 0 0 16px; accent-color: var(--pink); } .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .action { display: flex; align-items: center; justify-content: center; min-height: 42px; padding: 8px; border: 1px solid #ffffff0d; border-radius: 11px; background: #ffffff0d; color: #eeeaff; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-align: center; text-transform: uppercase; cursor: pointer; } .action.download { border: 0; background: linear-gradient(120deg,#ab8aff,#f07ed0); color: #1b0923; } .action.share { grid-column: span 2; background: transparent; border-color: var(--line); color: var(--muted); } .action.disabled { opacity: .42; pointer-events: none; } .empty { grid-column: 1/-1; padding: 48px; border: 1px dashed var(--line); border-radius: 18px; color: var(--muted); } .footer { padding: 22px 0 48px; border-top: 1px solid var(--line); color: #938ba8; font-size: 12px; } .reveal { opacity: 0; transform: translateY(18px); transition: opacity .3s ease,transform .3s ease; } .reveal.is-visible { opacity: 1; transform: none; } .card.is-shared { box-shadow: 0 0 0 4px #f496df48,0 0 60px #b59aff7a; } @keyframes featured-glow{ 0%, 100% {  box-shadow: 0 22px 60px #00000032; }  50% {  box-shadow: 0 22px 60px #00000032,0 0 30px #e9be582d; } } @media (min-width:860px){ .featured-side {  display: flex;  flex: 1;  align-items: center;  justify-content: center; } } .scroll-cue { display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--ink); text-decoration: none; animation: scroll-cue-float 2.2s ease-in-out infinite; } .scroll-cue-arrow { width: 34px; height: 34px; color: var(--pink); filter: drop-shadow(0 0 14px #ff83d880); } .scroll-cue-text { font-family: "Champion Gothic","Arial Black",sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .32em; text-transform: uppercase; } @keyframes scroll-cue-float{ 0%, 100% {  transform: translateY(0); }  50% {  transform: translateY(12px); } } @media (max-width:600px){ .wrap {  width: min(100% - 30px,1180px); }  .nav {  height: 70px; }  .brand img {  width: 118px; }  .back {  font-size: 10px; }  header {  padding: 70px 0 48px; }  header p {  font-size: 15px; }  .featured-section {  margin-bottom: 56px; }  .featured-card {  max-width: none; }  .grid {  grid-template-columns: 1fr;  gap: 14px; }  .content {  padding: 17px; } } @media (prefers-reduced-motion:reduce){ *, *:before, *:after {  transition: none!important;  animation: none!important; }  .reveal {  opacity: 1;  transform: none; } }</style>

    <body>
        <div class="wrap nav">
            <a class="brand" href="../" aria-label="DJgeeorge, inicio"><img src="../logos/logo-blanco.png" alt="DJgeeorge"></a>
            <a class="back" href="../"><b>←</b> Volver a la web</a>
        </div>
        <header class="wrap">
            <span class="tag">DJgeeorge &middot; Mashups</span>
            <h1>Mashups</h1>
            <p>Previews seleccionados, vídeos completos y descargas en un mismo lugar.</p>
        </header>
        <main class="wrap">
            <section class="featured-section" id="featured-section">
                <p class="section-label">Recién publicado</p>
                <h2 class="section-title">Mashup destacado</h2>
                <div class="featured-body">
                    <div id="featured"></div>
                    <div class="featured-side" aria-hidden="true">
                        <a href="#all-mashups" class="scroll-cue"><svg class="scroll-cue-arrow" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 12 L20 26 L32 12 L28 8 L20 18 L12 8 Z" fill="currentColor"/>
                            </svg><span class="scroll-cue-text">Desliza</span></a>
                    </div>
                </div>
            </section>
            <section id="all-mashups">
                <h2 class="all-title">Todos los mashups</h2>
                <div class="grid" id="grid"></div>
            </section>
        </main>
        <footer>
            <div class="wrap footer">© 2026 DJgeeorge · Cartagena, Murcia</div>
        </footer>
        <script src="../mashups/mashups-data.js"></script>
        <script src="player.js"></script>
        <script>
    const grid=document.querySelector('#grid'),featured=document.querySelector('#featured'),featuredSection=document.querySelector('#featured-section'),featuredLabel=document.querySelector('.section-label'),allMashups=document.querySelector('#all-mashups'),site='https://djgeeorge.qd.je/descargas/',esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),slug=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''),items=window.DJGEEORGE_MASHUPS||[],selected=new URLSearchParams(location.search).get('m'),link=(klass,url,label)=>url?`<a class="action ${klass}" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`:`<span class="action ${klass} disabled">${label}</span>`;
    function publishedLabel(item){const saved=Date.parse(item.publishedAt||''),fromCover=Number((item.cover||'').match(/-(\d{13})-cover\./)?.[1]),time=Number.isFinite(saved)?saved:fromCover;if(!time||time>Date.now())return 'Publicado recientemente';const seconds=Math.floor((Date.now()-time)/1000),minutes=Math.floor(seconds/60),hours=Math.floor(minutes/60),days=Math.floor(hours/24);if(minutes<1)return 'Publicado hace unos segundos';if(minutes<60)return `Publicado hace ${minutes} ${minutes===1?'minuto':'minutos'}`;if(hours<24)return `Publicado hace ${hours} ${hours===1?'hora':'horas'}`;return `Publicado hace ${days} ${days===1?'día':'días'}`}
    function makeCard(item,isFeatured=false){const id=slug(item.title),shareUrl=`${site}?m=${encodeURIComponent(id)}`,videoLabel=item.youtubePending?'Vídeo completo próximamente en YouTube':'Ver completo (yt)',card=document.createElement('article');card.className=`card reveal${isFeatured?' featured-card':''}`;card.id=`mashup-${id}`;card.innerHTML=`<div class="cover"><img src="${esc(item.cover)}" alt="Portada de ${esc(item.title)}"></div><div class="content"><h2>${esc(item.title)}</h2>${item.preview?`<label class="preview-label">Preview</label>${window.DJGEEORGE_PLAYER.markup(item.preview)}`:''}<div class="actions">${link('',item.listen,videoLabel)}${link('download',item.download,'Descargar')}<button class="action share" type="button">Compartir</button></div></div>`;window.DJGEEORGE_PLAYER.setup(card);card.querySelector('.share').onclick=async()=>{const text=`Mira este nuevo mashup de @DJgeeorge: ${item.title}`;try{if(navigator.share){await navigator.share({title:`DJgeeorge — ${item.title}`,text,url:shareUrl})}else{await navigator.clipboard.writeText(`${text}\n${shareUrl}`);card.querySelector('.share').textContent='Enlace copiado ✓'}}catch(error){if(error.name!=='AbortError')console.error(error)}};if(selected===id){card.classList.add('is-shared');setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'center'}),180)}return card}
    if(!items.length){featuredSection.hidden=true;grid.innerHTML='<div class="empty">Los primeros mashups están llegando. Vuelve pronto.</div>'}else{featuredLabel.textContent=publishedLabel(items[0]);const newest=makeCard(items[0],true);featured.append(newest);setTimeout(()=>newest.classList.add('is-visible'),140);if(items.length===1){allMashups.hidden=true}else{items.slice(1).forEach((item,index)=>{const card=makeCard(item);grid.append(card);setTimeout(()=>card.classList.add('is-visible'),260+index*90)})}}
  </script>
