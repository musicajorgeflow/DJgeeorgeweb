<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b22"><meta name="description" content="Mashups y previews de DJgeeorge."><title>Mashups — DJgeeorge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#100b22;--panel:#1b1331cc;--ink:#f8f6ff;--muted:#b6afca;--violet:#a083ff;--pink:#ff83d8;--line:#ffffff17;--font:Manrope,system-ui,sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{min-height:100vh;margin:0;overflow-x:hidden;background:radial-gradient(ellipse 62% 40% at 6% -8%,#7651ec70,transparent 68%),radial-gradient(ellipse 45% 34% at 94% 15%,#f569cf30,transparent 65%),linear-gradient(155deg,#150d2e,#0c0917 74%);color:var(--ink);font:15px/1.5 var(--font)}body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(35px);pointer-events:none}body:before{width:44vw;height:44vw;top:48%;left:-25vw;background:#5b3bd032}body:after{width:38vw;height:38vw;right:-20vw;top:62%;background:#f35fca21}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 48px));margin:auto}.nav{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand img{width:136px;height:auto}.back{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em}.back:hover{color:#fff}.back b{font-size:18px;font-weight:400}header{padding:clamp(70px,11vw,135px) 0 64px}.tag{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid #c7b9ff42;border-radius:99px;background:#9c7dff13;color:#dfd6ff;font:10px 'DM Mono';letter-spacing:.12em;text-transform:uppercase}.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 16px var(--pink)}h1{max-width:800px;margin:18px 0;font-size:clamp(54px,10vw,136px);line-height:.87;letter-spacing:-.08em}h1 span{color:transparent;-webkit-text-stroke:1px #d9d0ff}header p{max-width:530px;margin:0;color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;padding-bottom:96px}.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#231a3dde,#151025de);box-shadow:0 22px 60px #00000032}.cover{position:relative;aspect-ratio:1;overflow:hidden;background:#271c48}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,#130d2570)}.cover img{width:100%;height:100%;object-fit:cover}.content{padding:20px}.content h2{margin:0 0 16px;font-size:20px;letter-spacing:-.035em;line-height:1.1}.preview-label{display:block;margin-bottom:6px;color:var(--muted);font:10px 'DM Mono';letter-spacing:.12em;text-transform:uppercase}.preview{width:100%;height:38px;margin:0 0 16px;accent-color:var(--pink)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{display:flex;align-items:center;justify-content:center;min-height:42px;padding:8px;border:1px solid #ffffff0d;border-radius:11px;background:#ffffff0d;color:#eeeaff;font-size:10px;font-weight:800;letter-spacing:.06em;text-align:center;text-transform:uppercase;cursor:pointer}.action.download{border:0;background:linear-gradient(120deg,#ab8aff,#f07ed0);color:#1b0923}.action.share{grid-column:span 2;background:transparent;border-color:var(--line);color:var(--muted)}.action.disabled{opacity:.42;pointer-events:none}.empty{grid-column:1/-1;padding:48px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.footer{padding:22px 0 48px;border-top:1px solid var(--line);color:#938ba8;font-size:12px}.reveal{opacity:0;transform:translateY(18px);transition:opacity .3s ease,transform .3s eas <body><div class="wrap nav"><a class="brand" href="../" aria-label="DJgeeorge, inicio"><img src="../logos/logo-blanco.png" alt="DJgeeorge"></a><a class="back" href="../"><b>←</b> Volver a la web</a></div><header class="wrap"><span class="tag">DJgeeorge · Mashups</span><h1>Últimos<br><span>mashups</span></h1><p>Previews seleccionados, vídeos completos y descargas en un mismo lugar.</p></header><main class="wrap"><div class="grid" id="grid"></div></main><footer><div class="wrap footer">© 2026 DJgeeorge · Cartagena, Murcia</div></footer>
<script src="../mashups/mashups-data.js"></script><script>const grid=document.querySelector('#grid'),site='https://djgeeorge.qd.je/descargas/',esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),slug=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''),items=window.DJGEEORGE_MASHUPS||[],selected=new URLSearchParams(location.search).get('m'),link=(klass,url,label)=>url?`<a class="action ${klass}" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`:`<span class="action ${klass} disabled">${label}</span>`;if(!items.length){grid.innerHTML='<div class="empty">Los primeros mashups están llegando. Vuelve pronto.</div>'}else items.forEach(item=>{const id=slug(item.title),shareUrl=`${site}?m=${encodeURIComponent(id)}`,videoLabel=item.youtubePending?'Vídeo completo próximamente en YouTube':'Ver completo (yt)',card=document.createElement('article');card.className='card reveal';card.id=`mashup-${id}`;card.innerHTML=`<div class="cover"><img src="${esc(item.cover)}" alt="Portada de ${esc(item.title)}"></div><div class="content"><h2>${esc(item.title)}</h2>${item.preview?`<label class="preview-label">Preview</label><audio class="preview" controls preload="none" src="${esc(item.preview)}">Tu navegador no admite audio.</audio>`:''}<div class="actions">${link('',item.listen,videoLabel)}${link('download',item.download,'Descargar')}<button class="action share" type="button">Compartir</button></div></div>`;card.querySelector('.preview')?.addEventListener('play',event=>document.querySelectorAll('.preview').forEach(audio=>{if(audio!==event.currentTarget)audio.pause()}));card.querySelector('.share').onclick=async()=>{const text=`Mira este nuevo mashup de @DJgeeorge: ${item.title}`;try{if(navigator.share){await navigator.share({title:`DJgeeorge — ${item.title}`,text,url:shareUrl})}else{await navigator.clipboard.writeText(`${text}\n${shareUrl}`);card.querySelector('.share').textContent='Enlace copiado ✓'}}catch(error){if(error.name!=='AbortError')console.error(error)}};grid.append(card);if(selected===id){card.classList.add('is-shared');setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'center'}),180)}});document.querySelectorAll('.card').forEach((card,index)=>setTimeout(()=>card.classList.add('is-visible'),index*90));</script><script src="palette.js"></script></body></html>
